worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # 🛡️ Hide Nginx version

    # 🛡️ Limit Request/Rate Limiting (Anti-DDoS, Disesuaikan untuk NAT Institusi)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Buffer Limits (Anti Buffer Overflow)
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    client_max_body_size 500M; # Untuk upload file video maksimal 500MB
    large_client_header_buffers 4 8k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    upstream backend {
        server app:8080;
    }

    # --------------------------------------------------------
    # 🛡️ Default Server Block (Drop Unrecognized Domains)
    # --------------------------------------------------------
    server {
        listen 80 default_server;
        listen 443 ssl http2 default_server;
        server_name _;
        
        # Self-signed cert untuk default server (harus di-generate) atau pakai certbot dummy
        ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
        ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
        
        return 444; # Connection Closed Without Response
    }

    # --------------------------------------------------------
    # HTTP -> HTTPS Redirect & Certbot Challenge
    # --------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name api.satusekolah.id;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------
    # Enterprise-Grade HTTPS Server
    # --------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.satusekolah.id;

        # 🛡️ Block Invalid HTTP Methods
        if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS)$ ) {
            return 405;
        }

        # SSL Configuration (Let's Encrypt Paths)
        ssl_certificate /etc/letsencrypt/live/api.satusekolah.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.satusekolah.id/privkey.pem;

        # 🛡️ SSL Security Settings (Strict)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # 🛡️ Enterprise Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://api.satusekolah.id; frame-ancestors 'none';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # 🛡️ Block Hidden Files (.env, .git, dll)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location / {
            # Apply Rate Limiting (Burst 100 untuk lonjakan trafik instan di jam istirahat)
            limit_req zone=api_limit burst=100 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket Support (Crucial for E2EE Chat)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}
