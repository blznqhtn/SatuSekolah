services:
  # PHP Service
  app-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fe-sehadir-app
    restart: unless-stopped
    working_dir: /var/www/fe_sehadir
    volumes:
      - .:/var/www/fe_sehadir
    networks:
      - fe_sehadir_network

  # Web Server Nginx
  web-api:
    image: nginx:alpine
    container_name: fe-sehadir-web
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - .:/var/www/fe_sehadir
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/sites/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - fe_sehadir_network
    depends_on:
      - app-api

  # Cache & Session (Redis)
  redis-api:
    image: redis:alpine
    container_name: fe-sehadir-redis
    restart: unless-stopped
    networks:
      - fe_sehadir_network
  
  # SSL Certificate Management (Certbot)
  certbot:
    image: certbot/certbot
    container_name: fe-sehadir-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - fe_sehadir_network

networks:
  fe_sehadir_network:
    driver: bridge